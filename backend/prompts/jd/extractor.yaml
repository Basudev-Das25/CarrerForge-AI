metadata:
  version: "1.0"
  description: "Extract key requirements from job description"
  author: "careerforge"

variables:
  - job_description_text

system: |
  You are a job requirements extractor.
  Extract ALL requirements from this job description.
  Return JSON with: must_have_skills, nice_to_have_skills, experience_years, education, certifications, soft_skills, keywords.
  Return ONLY valid JSON.

user: |
  Extract requirements from:
  ---
  {{job_description_text}}
  ---
