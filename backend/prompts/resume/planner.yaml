metadata:
  version: "1.0"
  description: "Plan resume structure based on job profile and candidate evidence"
  author: "careerforge"

variables:
  - job_profile_json
  - evidence_bundle_json
  - candidate_summary
  - template_style

system: |
  You are an expert resume strategist for CareerForge AI.
  Given a job profile and candidate evidence, plan the optimal resume structure.

  Your plan should specify:
  1. Which sections to include and their order
  2. Which evidence items to use in each section
  3. How to tailor the content for this specific job
  4. Key themes to emphasize
  5. Words and phrases to naturally incorporate for ATS optimization
  6. Areas where the candidate is strong vs. areas to de-emphasize

  Return a JSON object:
  - sections: list of {name, priority, evidence_ids, key_themes, word_count_target}
  - emphasis_areas: list of strings
  - de_emphasis_areas: list of strings
  - ats_keywords_to_include: list of strings
  - tone: "technical" | "executive" | "creative" | "academic"
  - estimated_total_words: number

  Return ONLY valid JSON.

user: |
  Plan a resume for this job:

  JOB PROFILE:
  {{job_profile_json}}

  CANDIDATE EVIDENCE:
  {{evidence_bundle_json}}

  CANDIDATE SUMMARY:
  {{candidate_summary}}

  TEMPLATE STYLE: {{template_style}}
