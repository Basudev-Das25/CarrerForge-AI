name: Build

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npx tsc --noEmit

      - name: Vite build
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          echo "Build output verified"

  backend-build:
    name: Backend Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify FastAPI app loads
        run: python -c "from app.main import app; print('FastAPI app loaded successfully')"

      - name: Verify imports
        run: |
          python -c "from app.config.settings import Settings; print('Settings OK')"
          python -c "from app.db.base import get_engine; print('DB engine OK')"
          python -c "from app.services.ai.providers.base import AIProvider; print('AI provider base OK')"
